<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found · Amir Rezgui</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        background: #F5F5EC;
        color: #222417;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
      .box {
        max-width: 480px;
        background: #FCFCF6;
        border: 1px solid #DCDCC5;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(60,70,20,.07);
      }
      h1 {
        font-size: 72px;
        margin: 0;
        color: #5E6E2A;
        font-weight: 700;
      }
      p {
        font-size: 18px;
        color: #565941;
        margin: 16px 0 24px;
      }
      a {
        display: inline-block;
        padding: 12px 28px;
        background: #5E6E2A;
        color: #fff;
        text-decoration: none;
        border-radius: 9999px;
        font-weight: 600;
        font-family: 'Inter', system-ui, sans-serif;
        transition: transform 0.2s;
      }
      a:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>404</h1>
      <p>The page you are looking for doesn't exist or has moved.</p>
      <a href="/">Return to Portfolio</a>
    </div>
  </body>
</html>
